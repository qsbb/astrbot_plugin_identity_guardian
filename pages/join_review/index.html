<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>凝心溯溪-序 · 入群审核</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-title">
        <p class="eyebrow">AstrBot 插件管理页</p>
        <h1>凝心溯溪-序 <span class="hero-badge"><span class="hero-badge-dot" aria-hidden="true"></span>Identity Guardian</span></h1>
        <p class="hero-subtitle">关系感知、权限边界与群组行动 · 入群审核</p>
      </div>
      <div class="toolbar">
        <button id="refresh-joined" class="button" type="button">↻ 刷新已加入群</button>
      </div>
    </header>

    <div class="toast-stack">
      <div id="page-error" class="notice error hidden" role="alert"></div>
      <div id="page-status" class="notice success hidden" role="status"></div>
    </div>

    <div class="cards" aria-label="审核概览">
      <article class="metric metric-total"><span>群总数</span><strong class="skeleton" data-stat="total_groups">—</strong></article>
      <article class="metric metric-reviewable"><span>可审核群</span><strong class="accent skeleton" data-stat="reviewable_groups">—</strong></article>
      <article class="metric metric-pending"><span>待审申请</span><strong class="warn skeleton" data-stat="pending_requests">—</strong></article>
    </div>

    <section id="legacy-notice" class="card legacy-notice hidden" aria-labelledby="legacy-title">
      <div class="section-heading">
        <div>
          <h2 id="legacy-title">检测到旧版全局审核配置</h2>
          <p>旧配置不会自动启用。请勾选要迁移的群，再明确应用。</p>
        </div>
        <button id="apply-legacy" class="button secondary" type="button">应用旧配置到所选群</button>
      </div>
    </section>

    <article class="card" aria-labelledby="groups-title">
      <div class="section-heading">
        <div>
          <h2 id="groups-title">群配置</h2>
          <p id="group-summary">正在读取群列表…</p>
        </div>
      </div>

      <div class="batch-toolbar" aria-label="批量配置操作">
        <label class="select-all-label">
          <input id="select-all" type="checkbox">
          <span>全选</span>
        </label>
        <span id="selected-count" class="selected-count">已选择 0 个群</span>
        <div class="batch-actions">
          <button class="button compact" type="button" data-batch-action="add">添加配置</button>
          <button class="button compact" type="button" data-batch-action="enable_auto_audit">开启自动审核</button>
          <button class="button compact" type="button" data-batch-action="enable_review_send">开启发送审核</button>
          <button class="button compact danger-quiet" type="button" data-batch-action="disable_all">全部关闭</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table groups-table">
          <thead>
            <tr>
              <th class="select-column"><span class="sr-only">选择</span></th>
              <th>群</th>
              <th>Bot / 权限</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="groups-body">
            <tr class="empty-row"><td colspan="5">正在加载…</td></tr>
          </tbody>
        </table>
      </div>
    </article>

    <article class="card" aria-labelledby="requests-title">
      <div class="section-heading request-heading">
        <div>
          <h2 id="requests-title">待审申请</h2>
          <p id="request-summary">正在读取申请…</p>
        </div>
        <button id="refresh-requests" class="button secondary compact" type="button">↻ 刷新申请</button>
      </div>
      <div id="requests-list" class="request-list" aria-live="polite">
        <p class="empty-state">正在加载…</p>
      </div>
    </article>
  </main>

  <div id="group-popover" class="group-popover hidden" role="dialog" aria-label="群审核设置"></div>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
